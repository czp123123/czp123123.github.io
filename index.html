<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大乐透号码选择器 (5+2)</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        header {
            background: #e60012;
            color: white;
            text-align: center;
            padding: 20px;
        }
        h1 {
            margin: 0;
            font-size: 28px;
        }
        .subtitle {
            font-size: 16px;
            opacity: 0.9;
            margin-top: 5px;
        }
        
        .section {
            padding: 25px;
        }
        
        .red-area {
            background: #fff0f0;
            border-left: 6px solid #e60012;
        }
        .blue-area {
            background: #f0f8ff;
            border-left: 6px solid #0066cc;
        }
        
        h2 {
            margin: 0 0 15px 0;
            color: #333;
        }
        .red-title { color: #e60012; }
        .blue-title { color: #0066cc; }
        
        .number-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }
        
        .number {
            width: 100%;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            border: 2px solid #ddd;
        }
        
        .number:hover {
            transform: scale(1.1);
        }
        
        .red-ball {
            background: #fff;
            color: #e60012;
            border-color: #e60012;
        }
        
        .red-ball.selected {
            background: #e60012;
            color: white;
            box-shadow: 0 4px 8px rgba(230, 0, 18, 0.4);
        }
        
        .blue-ball {
            background: #fff;
            color: #0066cc;
            border-color: #0066cc;
        }
        
        .blue-ball.selected {
            background: #0066cc;
            color: white;
            box-shadow: 0 4px 8px rgba(0, 102, 204, 0.4);
        }
        
        .selected-numbers {
            margin: 20px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            min-height: 60px;
        }
        
        .selected-display {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 8px;
        }
        
        .red-display { color: #e60012; }
        .blue-display { color: #0066cc; }
        
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .btn-random {
            background: #e60012;
            color: white;
        }
        
        .btn-random:hover {
            background: #c40010;
            transform: translateY(-2px);
        }
        
        .btn-clear {
            background: #666;
            color: white;
        }
        
        .btn-clear:hover {
            background: #555;
        }
        
        .count {
            font-size: 15px;
            color: #666;
            margin-top: 8px;
        }
        
        footer {
            text-align: center;
            padding: 15px;
            color: #999;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>大乐透号码选择器</h1>
            <p class="subtitle">前区 01-35 选5个 + 后区 01-12 选2个</p >
        </header>
        
        <div class="section red-area">
            <h2 class="red-title">前区<span style="font-size:16px;">（已选 <span id="red-count">0</span>/5）</span></h2>
            <div class="number-grid" id="red-grid"></div>
        </div>
        
        <div class="section blue-area">
            <h2 class="blue-title">后区<span style="font-size:16px;">（已选 <span id="blue-count">0</span>/2）</span></h2>
            <div class="number-grid" id="blue-grid"></div>
        </div>
        
        <div class="section">
            <h2>已选号码</h2>
            <div class="selected-numbers">
                <div class="selected-display">
                    <span id="selected-red" class="red-display"></span>
                    <span id="selected-blue" class="blue-display"></span>
                </div>
            </div>
            
            <div class="btn-group">
                <button class="btn-random" onclick="randomSelect()">随机生成一注</button>
                <button class="btn-clear" onclick="clearAll()">清空所有选择</button>
            </div>
        </div>
        
        <footer>
            大乐透号码选择工具 © 2026
        </footer>
    </div>

    <script>
        let selectedRed = [];
        let selectedBlue = [];
        
        // 创建前区号码（01-35）
        function createRedBalls() {
            const grid = document.getElementById('red-grid');
            grid.innerHTML = '';
            
            for (let i = 1; i <= 35; i++) {
                const num = i < 10 ? '0' + i : i;
                const ball = document.createElement('div');
                ball.className = 'number red-ball';
                ball.textContent = num;
                ball.dataset.value = i;
                ball.onclick = () => toggleRed(i, ball);
                grid.appendChild(ball);
            }
        }
        
        // 创建后区号码（01-12）
        function createBlueBalls() {
            const grid = document.getElementById('blue-grid');
            grid.innerHTML = '';
            
            for (let i = 1; i <= 12; i++) {
                const num = i < 10 ? '0' + i : i;
                const ball = document.createElement('div');
                ball.className = 'number blue-ball';
                ball.textContent = num;
                ball.dataset.value = i;
                ball.onclick = () => toggleBlue(i, ball);
                grid.appendChild(ball);
            }
        }
        
        function toggleRed(num, element) {
            if (selectedRed.includes(num)) {
                // 取消选择
                selectedRed = selectedRed.filter(n => n !== num);
                element.classList.remove('selected');
            } else {
                if (selectedRed.length >= 5) {
                    alert('前区最多只能选择5个号码！');
                    return;
                }
                selectedRed.push(num);
                element.classList.add('selected');
            }
            updateDisplay();
        }
        
        function toggleBlue(num, element) {
            if (selectedBlue.includes(num)) {
                // 取消选择
                selectedBlue = selectedBlue.filter(n => n !== num);
                element.classList.remove('selected');
            } else {
                if (selectedBlue.length >= 2) {
                    alert('后区最多只能选择2个号码！');
                    return;
                }
                selectedBlue.push(num);
                element.classList.add('selected');
            }
            updateDisplay();
        }
        
        function updateDisplay() {
            // 更新计数
            document.getElementById('red-count').textContent = selectedRed.length;
            document.getElementById('blue-count').textContent = selectedBlue.length;
            
            // 排序并显示已选号码
            const sortedRed = [...selectedRed].sort((a,b) => a - b);
            const sortedBlue = [...selectedBlue].sort((a,b) => a - b);
            
            const redStr = sortedRed.map(n => n < 10 ? '0' + n : n).join('  ');
            const blueStr = sortedBlue.map(n => n < 10 ? '0' + n : n).join('  ');
            
            document.getElementById('selected-red').textContent = redStr ? redStr + '  ' : '';
            document.getElementById('selected-blue').textContent = blueStr;
        }
        
        // 随机生成一注
        function randomSelect() {
            clearAll();
            
            // 随机选前区5个
            const redPool = Array.from({length: 35}, (_, i) => i + 1);
            selectedRed = [];
            for (let i = 0; i < 5; i++) {
                const randomIndex = Math.floor(Math.random() * redPool.length);
                selectedRed.push(redPool[randomIndex]);
                redPool.splice(randomIndex, 1);
            }
            
            // 随机选后区2个
            const bluePool = Array.from({length: 12}, (_, i) => i + 1);
            selectedBlue = [];
            for (let i = 0; i < 2; i++) {
                const randomIndex = Math.floor(Math.random() * bluePool.length);
                selectedBlue.push(bluePool[randomIndex]);
                bluePool.splice(randomIndex, 1);
            }
            
            // 高亮选中的球
            highlightSelected();
            updateDisplay();
        }
        
        function highlightSelected() {
            // 高亮红球
            document.querySelectorAll('#red-grid .number').forEach(ball => {
                const value = parseInt(ball.dataset.value);
                if (selectedRed.includes(value)) {
                    ball.classList.add('selected');
                } else {
                    ball.classList.remove('selected');
                }
            });
            
            // 高亮蓝球
            document.querySelectorAll('#blue-grid .number').forEach(ball => {
                const value = parseInt(ball.dataset.value);
                if (selectedBlue.includes(value)) {
                    ball.classList.add('selected');
                } else {
                    ball.classList.remove('selected');
                }
            });
        }
        
        function clearAll() {
            selectedRed = [];
            selectedBlue = [];
            document.querySelectorAll('.number').forEach(ball => {
                ball.classList.remove('selected');
            });
            updateDisplay();
        }
        
        // 初始化
        window.onload = function() {
            createRedBalls();
            createBlueBalls();
            updateDisplay();
        };
    </script>
</body>
</html>
